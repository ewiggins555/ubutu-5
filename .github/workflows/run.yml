name: mta-test-box
on:
  workflow_dispatch:
    inputs:
      correlation_id:
        description: 'Kat3emmerha l tracker bax y-matchi had run'
        required: false
        default: ''

# Tracker kay-injecti correlation_id, w kay-matchi b had run-name.
run-name: Box ${{ inputs.correlation_id }}

jobs:
  box:
    runs-on: ubuntu-latest
    timeout-minutes: 350

    steps:
      - name: Verifi l distribution
        run: |
          . /etc/os-release
          echo "OS       : $PRETTY_NAME"
          echo "systemd  : $(pidof systemd > /dev/null && echo kayn || echo MAKAYNCH)"
          case "$ID:$VERSION_ID" in
            ubuntu:20.04|ubuntu:22.04|centos:7|centos:9)
              echo "OK - vugex.jar kay-supporta had l distribution" ;;
            *)
              echo "::error::$PRETTY_NAME machi mad3oum."
              exit 1 ;;
          esac

      - name: IPv4 bark
        run: |
          sudo sysctl -w net.ipv6.conf.all.disable_ipv6=1
          sudo sysctl -w net.ipv6.conf.default.disable_ipv6=1
          sudo sysctl -w net.ipv6.conf.lo.disable_ipv6=1

      - name: Check IP blacklist
        id: ip_check
        run: |
          OUT_IP=$(curl -4 -s --connect-timeout 10 https://api.ipify.org)
          echo "IP: $OUT_IP"
          echo "OUT_IP=$OUT_IP" >> $GITHUB_ENV
          REV_IP=$(echo "$OUT_IP" | awk -F. '{print $4"."$3"."$2"."$1}')
          sudo apt-get update -qq && sudo apt-get install -y -qq dnsutils

          # FATAL = kat-fashel l run w tracker y3awd b IP jdida.
          # WARN  = ghir kat-bayen, ma-kat-fashelch (barracuda/spamcop kat-listiw
          #         bzzaf d IPs dyal cloud, machi dima important l email).
          FATAL_BL="zen.spamhaus.org"
          WARN_BL="sbl.spamhaus.org pbl.spamhaus.org bl.spamcop.net b.barracudacentral.org"

          FATAL_HITS=""
          for bl in $FATAL_BL; do
            R=$(dig +short "$REV_IP.$bl" 2>/dev/null | head -1)
            if [ -n "$R" ]; then echo "  [FATAL] $bl -> $R"; FATAL_HITS="$FATAL_HITS $bl"; else echo "  [OK]    $bl"; fi
          done
          WARN_HITS=""
          for bl in $WARN_BL; do
            R=$(dig +short "$REV_IP.$bl" 2>/dev/null | head -1)
            if [ -n "$R" ]; then echo "  [warn]  $bl -> $R"; WARN_HITS="$WARN_HITS$bl "; else echo "  [OK]    $bl"; fi
          done

          if [ -n "$FATAL_HITS" ]; then
            echo "::error::IP $OUT_IP blacklisted (fatal):$FATAL_HITS"
            echo "BLACKLIST=fatal:$FATAL_HITS" >> $GITHUB_ENV
            exit 1
          fi

          BL_STATUS="clean"
          [ -n "$WARN_HITS" ] && BL_STATUS="warn: $WARN_HITS"
          echo "BLACKLIST=$BL_STATUS" >> $GITHUB_ENV
          echo "IP CLEAN 3la l fatal lists. warnings: ${WARN_HITS:-none}"
          echo "IP_CLEAN=true" >> $GITHUB_ENV

      - name: Install ipset
        if: env.IP_CLEAN == 'true'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ipset

      - name: Whitelist GitHub + Blacklist Microsoft
        if: env.IP_CLEAN == 'true'
        run: |
          echo "========================================"
          echo "  WHITELIST GH + BLACKLIST MS (IPv4)"
          echo "========================================"

          sudo ipset create GH_WHITELIST hash:net hashsize 4096 maxelem 65536 2>/dev/null || sudo ipset flush GH_WHITELIST
          sudo ipset create MS_BLACKLIST hash:net hashsize 4096 maxelem 65536 2>/dev/null || sudo ipset flush MS_BLACKLIST

          echo "[1/4] Jib GitHub IPs..."
          GH_COUNT=0
          GH_API_IPS=$(curl -4 -s --connect-timeout 10 https://api.github.com/meta 2>/dev/null | jq -r '.actions[]? // empty' 2>/dev/null || true)
          
          if [ -n "$GH_API_IPS" ]; then
            while IFS= read -r ip; do
              [ -z "$ip" ] && continue
              if echo "$ip" | grep -qE '^([0-9]{1,3}\.){3}[0-9]{1,3}(/([0-9]{1,2}))?$'; then
                if sudo ipset add GH_WHITELIST "$ip" 2>/dev/null; then
                  GH_COUNT=$((GH_COUNT + 1))
                fi
              fi
            done <<< "$GH_API_IPS"
          fi
          echo "  -> $GH_COUNT GitHub IPs"

          echo "[2/4] Jib Microsoft IPs..."
          MS_JSON=$(curl -4 -s --connect-timeout 15 "https://endpoints.office.com/endpoints/worldwide?clientrequestid=$(uuidgen)" 2>/dev/null || true)
          MS_TOTAL=0
          MS_BANNED=0
          MS_SKIPPED=0
          
          if [ -n "$MS_JSON" ] && echo "$MS_JSON" | jq -e . >/dev/null 2>&1; then
            while IFS= read -r ip; do
              [ -z "$ip" ] && continue
              MS_TOTAL=$((MS_TOTAL + 1))
              if ! echo "$ip" | grep -qE '^([0-9]{1,3}\.){3}[0-9]{1,3}(/([0-9]{1,2}))?$'; then
                MS_SKIPPED=$((MS_SKIPPED + 1))
                continue
              fi
              if sudo ipset test GH_WHITELIST "$ip" 2>/dev/null; then
                MS_SKIPPED=$((MS_SKIPPED + 1))
                continue
              fi
              if sudo ipset add MS_BLACKLIST "$ip" 2>/dev/null; then
                MS_BANNED=$((MS_BANNED + 1))
              fi
            done < <(echo "$MS_JSON" | jq -r '.[].ips[]? // empty' 2>/dev/null || true)
          fi
          echo "  -> Banned: $MS_BANNED | Skipped: $MS_SKIPPED"

          echo "[3/4] Apply iptables rules..."
          sudo iptables -D INPUT -m set --match-set GH_WHITELIST src -j ACCEPT 2>/dev/null || true
          sudo iptables -D INPUT -m set --match-set MS_BLACKLIST src -j DROP 2>/dev/null || true
          sudo iptables -I INPUT 1 -m set --match-set GH_WHITELIST src -j ACCEPT
          sudo iptables -I INPUT 2 -m set --match-set MS_BLACKLIST src -j DROP
          echo "  -> Done!"

          echo "[4/4] Save..."
          sudo ipset list GH_WHITELIST -t 2>/dev/null | grep -E '^[0-9]' > /etc/gh-whitelist.conf 2>/dev/null || true
          sudo ipset list MS_BLACKLIST -t 2>/dev/null | grep -E '^[0-9]' > /etc/ms-blacklist.conf 2>/dev/null || true
          
          echo "GH_WHITELIST_COUNT=$GH_COUNT" >> $GITHUB_ENV
          echo "MS_BLACKLIST_COUNT=$MS_BANNED" >> $GITHUB_ENV
          echo "MS_SKIPPED_COUNT=$MS_SKIPPED" >> $GITHUB_ENV
          
          echo "========================================"
          echo "  GH: $GH_COUNT | MS Banned: $MS_BANNED"
          echo "========================================"

      - name: SSH access
        if: env.IP_CLEAN == 'true'
        run: |
          sudo mkdir -p /run/sshd
          echo "root:${{ secrets.BOX_ROOT_PASSWORD }}" | sudo chpasswd
          sudo sed -i 's/^#\?PermitRootLogin.*/PermitRootLogin yes/' /etc/ssh/sshd_config
          sudo sed -i 's/^#\?PasswordAuthentication.*/PasswordAuthentication yes/' /etc/ssh/sshd_config
          sudo sed -i 's/^#\?AddressFamily.*/AddressFamily inet/' /etc/ssh/sshd_config
          grep -q '^AddressFamily' /etc/ssh/sshd_config || echo 'AddressFamily inet' | sudo tee -a /etc/ssh/sshd_config
          sudo systemctl restart ssh
          sudo systemctl is-active ssh

      - name: Install bore
        if: env.IP_CLEAN == 'true'
        run: |
          URL=$(curl -4 -s https://api.github.com/repos/ekzhang/bore/releases/latest \
                | grep -o 'https://[^"]*x86_64-unknown-linux-musl.tar.gz' | head -1)
          curl -4 -sL "$URL" | tar xz && sudo mv bore /usr/local/bin/
          bore --version

      - name: Tunnels
        if: env.IP_CLEAN == 'true'
        run: |
          set +e
          BORE_IP=$(getent ahostsv4 bore.pub | awk '{print $1}' | head -1)
          [ -z "$BORE_IP" ] && BORE_IP=159.223.110.159
          echo "bore.pub -> $BORE_IP"

          wait_port () {
            local LOG=$1 i P
            for i in $(seq 1 20); do
              P=$(grep -oE 'remote_port=[0-9]+|listening at [^ ]+:[0-9]+' "$LOG" 2>/dev/null \
                  | grep -oE '[0-9]+$' | tail -1)
              if [ -n "$P" ]; then echo "$P"; return 0; fi
              sleep 1
            done
            return 1
          }

          nohup bore local 22 --to bore.pub > /tmp/bore-ssh.log 2>&1 &
          SSH_PORT=$(wait_port /tmp/bore-ssh.log)

          nohup bore local 7997 --to bore.pub --port 7997 > /tmp/bore-pmta.log 2>&1 &
          PMTA_PORT=$(wait_port /tmp/bore-pmta.log)

          if [ -z "$PMTA_PORT" ]; then
            echo "port 7997 mekhdoud , kanjerreb random ..."
            nohup bore local 7997 --to bore.pub > /tmp/bore-pmta2.log 2>&1 &
            PMTA_PORT=$(wait_port /tmp/bore-pmta2.log)
          fi

          echo "=== LOGS DYAL BORE ==="
          for f in /tmp/bore-ssh.log /tmp/bore-pmta.log /tmp/bore-pmta2.log; do
            [ -f "$f" ] && { echo "--- $f"; cat "$f"; }
          done

          echo "SSH_PORT  = '$SSH_PORT'"
          echo "PMTA_PORT = '$PMTA_PORT'"

          { echo "BORE_IP=$BORE_IP"; echo "SSH_PORT=$SSH_PORT"; echo "PMTA_PORT=$PMTA_PORT"; } >> $GITHUB_ENV
          [ -n "$SSH_PORT" ] || { echo "::error::bore ma-3tach port l SSH"; exit 1; }

      - name: cloudflared l HTTP
        if: env.IP_CLEAN == 'true'
        run: |
          curl -4 -sL https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64.deb -o cf.deb
          sudo dpkg -i cf.deb
          nohup cloudflared tunnel --edge-ip-version 4 --url http://localhost:80 > /tmp/cf.log 2>&1 &
          sleep 12
          CF_URL=$(grep -o 'https://[a-z0-9-]*\.trycloudflare\.com' /tmp/cf.log | head -1)
          echo "CF_URL=$CF_URL" >> $GITHUB_ENV
          echo "HTTP : $CF_URL"

      - name: Report l tracker
        if: env.IP_CLEAN == 'true'
        env:
          CORR: ${{ inputs.correlation_id }}
        run: |
          if [ -z "$CORR" ]; then echo "ma-kaynch correlation, skip report"; exit 0; fi
          ETH_IP=$(ip -4 route get 1.1.1.1 2>/dev/null | awk '{for(i=1;i<=NF;i++) if($i=="src") print $(i+1)}' | head -1)
          PAYLOAD=$(printf '{"ip":"%s","ssh_port":"%s","pmta_port":"%s","out_ip":"%s","eth_ip":"%s","blacklist":"%s","user":"root"}' \
            "$BORE_IP" "$SSH_PORT" "$PMTA_PORT" "$OUT_IP" "$ETH_IP" "$BLACKLIST")
          echo "Reporting l tracker ($CORR): $PAYLOAD"
          # --retry b3da l cold-start dyal l instance l free
          CODE=$(curl -4 -s -o /dev/null -w '%{http_code}' --max-time 45 \
            --retry 4 --retry-delay 8 --retry-all-errors \
            -X POST "https://gha-run-tracker.onrender.com/api/ingest/$CORR" \
            -H "Content-Type: application/json" -d "$PAYLOAD" || echo "000")
          echo "Tracker HTTP: $CODE"
          echo "Tracker report: HTTP $CODE" >> "$GITHUB_STEP_SUMMARY"

      - name: Ma3loumat dyal l connexion
        if: env.IP_CLEAN == 'true'
        run: |
          ETH_IP=$(ip -4 route get 1.1.1.1 2>/dev/null | awk '{for(i=1;i<=NF;i++) if($i=="src") print $(i+1)}' | head -1)

          cat << 'EOF' >> "$GITHUB_STEP_SUMMARY"
          ## Connexion
          
          ```
          ssh -o StrictHostKeyChecking=no -p SSH_PORT root@BORE_IP
          ```
          
          | Khanet | Qima |
          |---|---|
          EOF

          echo "| Main IP | \`$BORE_IP\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| SSH Port | \`$SSH_PORT\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Username | \`root\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Password | l qima dyal secret BOX_ROOT_PASSWORD |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Available IPs V4 | \`$ETH_IP\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| PMTA Http Port | \`$PMTA_PORT\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "PMTA console : http://$BORE_IP:$PMTA_PORT" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Tracking ( HTTP ) : $CF_URL" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "---" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "### IP Status" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Item | Value |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---|" >> "$GITHUB_STEP_SUMMARY"
          echo "| Outgoing IP | \`$OUT_IP\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Blacklist Status | **CLEAN** |" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "> L IP clean, mzian l l emails!" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "---" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "### IP Filter" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Filter | Count |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---|" >> "$GITHUB_STEP_SUMMARY"
          echo "| GitHub Whitelist | $GH_WHITELIST_COUNT |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Microsoft Blacklist | $MS_BLACKLIST_COUNT |" >> "$GITHUB_STEP_SUMMARY"

      - name: khelli l box 7ayya
        if: env.IP_CLEAN == 'true'
        run: sleep 20000
